name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Catalog-Build ist aktuell (build-catalog --check)
        run: node scripts/build-catalog.mjs --check

      - name: Syntax + i18n + Hook-Audit (beide Builds) + Surface-Tripwire
        run: npm run check

      - name: Render-Smoketest (beide Builds, Stub-basiert)
        run: npm test
