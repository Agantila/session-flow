description: >-
  Ctrl+Scroll session cycling, Firefox-style session groups with project
  grouping, a session pane with list/grid views, sidebar-style content tabs
  and personalization — five features in a single plain-ESM plugin, all
  live-configurable from a built-in settings page. Catalog build
  (desktop/plugin.js) is SDK-only (panes, settings page, sidebar nav,
  palette, keybinds via ctx.register). Disclosure — reads the local Hermes
  gateway through public RPCs (projects.tree, projects.list, session.list,
  session.active_list, session.context_breakdown) plus focused-session
  state; writes via public RPCs on your actions (projects.create,
  projects.update, projects.add_folder, projects.remove_folder,
  projects.set_primary, projects.set_active, projects.delete, session.create,
  session.cwd.set, session.title, session.branch_stored, session.archive,
  session.close, session.delete); captures Ctrl+mouse-wheel across the app
  (browser zoom suppressed except over canvases, editors and zoomable
  images) to cycle sessions. Settings and groups stay in the app's local
  plugin storage. No outbound network calls, no telemetry, no credentials
  read or stored, no shell commands, no self-update. All timers are
  ctx-owned intervals disposed on unload (live-session poll ~30 s, session
  refresh ~45 s, project cache 60 s, activity expiry 30 s, lightweight UI
  sync 2–5 s). The standalone full build in this repo (full/plugin.js,
  install.sh) adds UI decorations via documented Desktop-Bridge doors; it
  is NOT part of this catalog entry and is disclosed in the repo README.
  Contact: info@agantila.com.
