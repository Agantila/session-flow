name: session-flow
repo: https://github.com/agantila/session-flow
sha: 3b731466f63229a6486d7033675dbec835d63fc0
description: >-
  Smooth line-by-line chat animation, Ctrl+Scroll session cycling,
  Firefox-style session groups, glass readability for the composer,
  sidebar-style content tabs and full personalization — six features
  in a single plain-ESM plugin, all live-configurable from a built-in
  settings page. Plain ESM, no build step, no dependencies, one file.
  Disclosure — pure UI layer (pane, settings page, sidebar nav, palette
  commands, i18n): reads Hermes's gateway state and atom feeds
  (`projects.tree`, `projects.list`, `session.active_list`, `sessions.list`,
  `app.state.focusedStoredSessionId` and session.context) and the localStorage
  key `hermes.desktop.projectScope` (writes it when the user picks a
  project in the composer chip); writes its own settings under
  `~/.hermes/cache/desktop-plugins/session-flow/settings.v1` and group slots.
  No outbound network calls, no telemetry, no credentials read or stored, no
  shell commands, no long-running background processes (one 30 s and one
  60 s polling timer only).
