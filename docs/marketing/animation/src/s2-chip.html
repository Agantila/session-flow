<!doctype html>
<!-- Session Flow Hyperframes — S2 Composer Glass + Projekt-Chip Pulse (1920x1080) -->
<!-- Stufe 2: leerer Chat, Composer im Glass-Look; Projekt-Chip pulst rein, Akzent-Gradient atmet. -->
<html><head><meta charset='utf-8'><link rel='stylesheet' href='../../src/heroes/base.css'>
<style>
html,body{width:1920px;height:1080px}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:linear-gradient(135deg,#1c1f27 0%,#0e1015 60%,#191b21 100%)}
.stage::before{content:'';position:absolute;inset:0;
  background:radial-gradient(40% 32% at 30% 70%,rgba(88,166,255,.18),transparent 70%),
             radial-gradient(34% 28% at 78% 24%,rgba(57,197,207,.10),transparent 72%)}
.window{position:absolute;left:300px;top:120px;width:1320px;height:840px;
  background:linear-gradient(180deg,#1d2026,#16181d);
  border:1px solid rgba(255,255,255,.10);border-radius:18px;
  box-shadow:0 40px 80px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  display:flex;overflow:hidden}
.pane{width:380px;background:var(--pane);border-right:1px solid var(--stroke);
  display:flex;flex-direction:column;flex-shrink:0;padding:20px 0}
.phead{display:flex;align-items:center;gap:8px;padding:0 16px 14px}
.ibtn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--text2);font-size:17px}
.ibtn.primary{background:rgba(88,166,255,.22);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(88,166,255,.45)}
.spacer{flex:1}
.ghd{display:flex;align-items:center;gap:8px;padding:8px 18px 6px 14px;
  font-size:15px;color:var(--text);font-weight:600}
.ghd .caret{color:var(--text3);font-size:15px}
.ghd .fic{color:#8b949e;font-size:16px}
.ghd .gcnt{margin-left:auto;font-size:12px;color:var(--text4);font-weight:500}
.srow{display:flex;align-items:center;gap:10px;margin:2px 12px;padding:10px 12px;
  border-radius:11px;font-size:14.5px;color:var(--text)}
.srow .act{font-size:16px;width:20px}
.srow .stitle{flex:1}
.main{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#15171c,#111318)}
.m-top{display:flex;align-items:center;gap:10px;padding:22px 36px;
  border-bottom:1px solid var(--stroke);font-size:18px;font-weight:600;color:var(--text2)}
.m-top .ci{font-size:20px;color:var(--text3)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text3);font-size:18px;gap:10px}
.empty .ci{font-size:64px;opacity:.32}
/* Composer zentriert, großer Glass */
.composer{position:relative;margin:0 90px 64px;border-radius:28px;overflow:hidden;
  background:rgba(22,24,29,.78);backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.comp-grad{position:absolute;inset:0;pointer-events:none;border-radius:28px;
  background:linear-gradient(165deg,rgba(88,166,255,.16),transparent 50%,rgba(57,197,207,.06));
  animation:glass 1.25s linear forwards}
@keyframes glass{0%{opacity:.0}50%{opacity:1}100%{opacity:1}}
/* Glow-Ring */
.comp-ring{position:absolute;inset:-1px;border-radius:29px;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(88,166,255,0),rgba(88,166,255,.6) 25%,rgba(88,166,255,0) 50%,rgba(57,197,207,.45) 75%,rgba(88,166,255,0));
  filter:blur(6px);opacity:.55;animation:ring 1.25s linear forwards}
@keyframes ring{0%{opacity:0;transform:scale(.96)}30%{opacity:.25}100%{opacity:.55;transform:scale(1)}}
.comp-row{display:flex;align-items:center;gap:12px;padding:18px 20px 18px 18px;position:relative;z-index:2}
.cinput{flex:1;font-size:17px;color:var(--text);min-height:30px;line-height:1.5}
.cinput .ph{color:var(--text3)}
.cinput .caret{display:inline-block;width:2px;height:20px;background:#58a6ff;
  margin-left:4px;vertical-align:-3px;animation:blink 1s steps(2) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
/* Projekt-Chip vor + — pulst rein, pulst danach */
.pchip{height:34px;display:flex;align-items:center;gap:9px;padding:0 13px;
  border-radius:99px;background:rgba(88,166,255,.14);
  border:1px solid rgba(88,166,255,.38);color:#b1d1f5;font-size:14.5px;font-weight:500;
  opacity:0;transform:scale(.85);transform-origin:left center;
  animation:chip 1.25s linear forwards}
@keyframes chip{0%{opacity:0;transform:scale(.85)}10%{opacity:0;transform:scale(.85)}
  25%{opacity:1;transform:scale(1.06)}36%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
.pchip .pdot{width:10px;height:10px;border-radius:50%;background:#58a6ff;
  box-shadow:0 0 10px rgba(88,166,255,.85)}
.pchip .caret{color:#7d9cbf;font-size:14px}
.plusbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;
  color:var(--text2);font-size:20px}
.sendbtn{width:38px;height:38px;border-radius:12px;background:#58a6ff;color:#0b0d12;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.tools{display:flex;align-items:center;gap:6px;padding:10px 18px 16px;position:relative;z-index:2;
  border-top:1px solid var(--stroke)}
.tools .tbtn{height:30px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);display:flex;align-items:center;gap:6px;
  color:var(--text2);font-size:12.5px}
.tools .tbtn .ci{font-size:14px}
.tools .spacer{flex:1}
.cap{position:absolute;left:300px;top:60px;font-size:22px;font-weight:600;
  color:rgba(255,255,255,.9)}
.cap small{font-weight:500;color:rgba(255,255,255,.5);margin-left:14px;font-size:16px}
</style></head>
<body>
<div class='stage'>
  <div class='cap'>Projekt-Chip &amp; Glass<small>Composer v1.21.0</small></div>
  <div class='window'>
    <div class='pane'>
      <div class='phead'>
        <span class='ibtn primary'><span class='ci'>&#xea7b;</span></span>
        <span class='spacer'></span>
        <span class='ibtn'><span class='ci'>&#xeb51;</span></span>
      </div>
      <div class='ghd'>
        <span class='caret'><span class='ci'>&#xeab4;</span></span>
        <span class='fic'><span class='ci'>&#xec9f;</span></span>
        <span>session-flow</span>
        <span class='gcnt'>4</span>
      </div>
      <div class='srow'>
        <span class='act' style='color:#3fb950'><span class='ci'>&#xeab2;</span></span>
        <span class='stitle'>Roadmap-Review Q4</span>
      </div>
      <div class='srow'>
        <span class='act' style='color:#3fb950'><span class='ci'>&#xeab2;</span></span>
        <span class='stitle'>Status-Sync</span>
      </div>
      <div class='srow'>
        <span class='act' style='color:#d29922'><span class='ci'>&#xea6c;</span></span>
        <span class='stitle'>Hyperframes-Build</span>
      </div>
    </div>
    <div class='main'>
      <div class='m-top'>
        <span class='ci'>&#xeac6;</span>
        <span>Neue Session</span>
      </div>
      <div class='empty'>
        <span class='ci'>&#xeb1d;</span>
        <span>Noch keine Nachrichten — schreib die erste.</span>
      </div>
      <div class='composer'>
        <div class='comp-grad'></div>
        <div class='comp-ring'></div>
        <div class='comp-row'>
          <span class='pchip'><span class='pdot'></span>agantila · hero-renderings<span class='caret'>&#xeab4;</span></span>
          <span class='plusbtn'><span class='ci'>&#xea60;</span></span>
          <span class='cinput'>Was kommt als Nächstes?<span class='caret'></span></span>
          <span class='sendbtn'>&#xea6e;</span>
        </div>
        <div class='tools'>
          <span class='tbtn'><span class='ci'>&#xea72;</span>Skills</span>
          <span class='tbtn'><span class='ci'>&#xeb66;</span>Artefakte</span>
          <span class='spacer'></span>
          <span class='tbtn'><span class='ci'>&#xea7b;</span>Modell</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
