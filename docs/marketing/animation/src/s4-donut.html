<!doctype html>
<!-- Session Flow Hyperframes — S4 Kontext-Donut + Bar wachsen rein (1920x1080) -->
<!-- Stufe 4: Tabs/Statusleiste mit Kontext-Indikatoren; Donut und Bar laufen synchron von 0% zu Zielwert. -->
<html><head><meta charset='utf-8'><link rel='stylesheet' href='../../src/heroes/base.css'>
<style>
html,body{width:1920px;height:1080px}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:linear-gradient(180deg,#141518 0%,#0c0d10 100%)}
.stage::before{content:'';position:absolute;inset:-12%;
  background:radial-gradient(46% 42% at 50% 46%,rgba(88,166,255,.07),transparent 68%)}
.stage::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 92% at 50% 48%,transparent 56%,rgba(0,0,0,.44) 100%)}
/* Tabs oben, Status darunter, dann 3 Donut-Karten nebeneinander */
.tabs{position:absolute;left:300px;top:120px;width:1320px;height:54px;
  display:flex;align-items:center;gap:6px;padding:0 18px;
  background:linear-gradient(180deg,#191b21,#16181d);
  border:1px solid rgba(255,255,255,.10);border-radius:18px 18px 6px 6px;
  box-shadow:0 12px 24px rgba(0,0,0,.3)}
.tab{height:34px;padding:0 14px;border-radius:9px;display:flex;align-items:center;gap:8px;
  color:var(--text2);font-size:14.5px;font-weight:500;
  border:1px solid transparent;background:rgba(255,255,255,.02)}
.tab.act{color:#fff;background:rgba(88,166,255,.16);
  box-shadow:inset 0 0 0 1px rgba(88,166,255,.4)}
.tab.work{position:relative;color:#fff;background:rgba(88,166,255,.10);
  box-shadow:inset 0 0 0 1px rgba(88,166,255,.32)}
.tab.work::after{content:'';position:absolute;inset:-2px;border-radius:11px;
  background:conic-gradient(from 0deg,rgba(88,166,255,0) 0deg,rgba(88,166,255,.6) 120deg,rgba(88,166,255,0) 240deg,rgba(57,197,207,.4) 320deg,rgba(88,166,255,0) 360deg);
  filter:blur(3px);opacity:.7;z-index:-1;animation:spin 2.4s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.tab .ci{font-size:15px}
.tab .dot{width:8px;height:8px;border-radius:50%;background:#58a6ff;
  box-shadow:0 0 6px rgba(88,166,255,.8)}
.tab .x{color:var(--text4);font-size:14px;margin-left:4px;width:18px;height:18px;
  border-radius:5px;display:flex;align-items:center;justify-content:center}
.tab .x:hover{background:rgba(255,255,255,.06);color:var(--text)}
/* Statusbar (Kontext-Bar) */
.statusbar{position:absolute;left:300px;top:182px;width:1320px;height:42px;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(180deg,#16181d,#131519);
  border-left:1px solid rgba(255,255,255,.10);border-right:1px solid rgba(255,255,255,.10);
  font-size:14px;color:var(--text2)}
.statusbar .pill{height:28px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);display:flex;align-items:center;gap:8px;color:var(--text2)}
.statusbar .spacer{flex:1}
/* Inhaltsbereich: 3 Karten mit Donut */
.body{position:absolute;left:300px;top:232px;width:1320px;height:728px;
  background:linear-gradient(180deg,#15171c,#111318);
  border:1px solid rgba(255,255,255,.10);border-radius:6px 6px 18px 18px;
  border-top:none;display:flex;align-items:center;justify-content:center;gap:48px;
  padding:60px}
/* Kontext-Donut-Karte */
.kcard{width:340px;background:rgba(22,24,29,.7);border:1px solid rgba(255,255,255,.10);
  border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;
  box-shadow:0 14px 30px rgba(0,0,0,.4)}
.kcard .ktitle{font-size:15px;color:var(--text2);font-weight:600}
.kcard .klabel{font-size:14px;color:var(--text3)}
/* Donut als SVG; Animation ueber stroke-dasharray */
.donut{width:200px;height:200px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ring-bg{stroke:rgba(255,255,255,.07);stroke-width:18;fill:none}
.donut .ring-fg{stroke-width:18;fill:none;stroke-linecap:round;
  transition:stroke-dasharray .05s linear}
.donut .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.donut.ok .ring-fg{stroke:#3fb950}
.donut.warn .ring-fg{stroke:#d29922}
.donut.high .ring-fg{stroke:#f85149}
/* Bar-Indikator */
.bar{width:200px;height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#58a6ff,#39c5cf)}
.cap{position:absolute;left:300px;top:60px;font-size:22px;font-weight:600;
  color:rgba(255,255,255,.9)}
.cap small{font-weight:500;color:rgba(255,255,255,.5);margin-left:14px;font-size:16px}
</style></head>
<body>
<div class='stage'>
  <div class='cap'>Kontext-Anzeige<small>Donut + Bar · 28 px</small></div>
  <div class='tabs'>
    <div class='tab work'><span class='dot'></span>Hero-Renderings bauen<span class='x'>&times;</span></div>
    <div class='tab'><span class='ci'>&#xea7b;</span>Roadmap-Review Q4<span class='x'>&times;</span></div>
    <div class='tab'><span class='ci'>&#xea7b;</span>Hyperframes-Build<span class='x'>&times;</span></div>
    <div class='tab act'><span class='ci'>&#xeb66;</span>Gloss-Refactor<span class='x'>&times;</span></div>
  </div>
  <div class='statusbar'>
    <span class='pill'><span class='ci' style='color:#3fb950'>&#xeab2;</span>OK · 3</span>
    <span class='pill'><span class='ci' style='color:#d29922'>&#xea6c;</span>1 läuft</span>
    <span class='spacer'></span>
    <span class='pill'><span class='ci' style='color:#58a6ff'>&#xeb1d;</span>Modell · Hermes-3</span>
  </div>
  <div class='body'>
    <div class='kcard'>
      <div class='ktitle'>Hero-Renderings bauen</div>
      <div class='donut ok'>
        <svg viewBox='0 0 100 100'>
          <circle class='ring-bg' cx='50' cy='50' r='42'/>
          <circle class='ring-fg' cx='50' cy='50' r='42' id='d1'/>
        </svg>
        <div class='pct' id='p1'>0%</div>
      </div>
      <div class='klabel'>Kontext 42 %</div>
    </div>
    <div class='kcard'>
      <div class='ktitle'>Roadmap-Review Q4</div>
      <div class='donut warn'>
        <svg viewBox='0 0 100 100'>
          <circle class='ring-bg' cx='50' cy='50' r='42'/>
          <circle class='ring-fg' cx='50' cy='50' r='42' id='d2'/>
        </svg>
        <div class='pct' id='p2'>0%</div>
      </div>
      <div class='klabel'>Kontext 78 %</div>
    </div>
    <div class='kcard'>
      <div class='ktitle'>Gloss-Refactor</div>
      <div class='donut high'>
        <svg viewBox='0 0 100 100'>
          <circle class='ring-bg' cx='50' cy='50' r='42'/>
          <circle class='ring-fg' cx='50' cy='50' r='42' id='d3'/>
        </svg>
        <div class='pct' id='p3'>0%</div>
      </div>
      <div class='klabel'>Kontext 93 %</div>
    </div>
  </div>
</div>
<script>
/* Donuts + Bar laufen 0% -> Ziel ueber 1.25 s, easing cubic-out */
const targets = [[42,'p1','d1'], [78,'p2','d2'], [93,'p3','d3']];
const C = 2*Math.PI*42; // 263.89
const t0 = performance.now();
const dur = 1250;
function tick(now){
  const t = Math.min(1, (now - t0) / dur);
  const e = 1 - Math.pow(1 - t, 3);
  for (const [target,pEl,cEl] of targets){
    const v = Math.round(target * e);
    document.getElementById(pEl).textContent = v + '%';
    document.getElementById(cEl).setAttribute('stroke-dasharray', (C * v/100) + ' ' + C);
  }
  if (t < 1) requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body></html>
