<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Session Flow — b12-status-icons</title>
<link rel="stylesheet" href="assets/codicon.css">
<link rel="stylesheet" href="sf-plugin.css">
<link rel="stylesheet" href="showcase.css">
</head>
<body class="card-body">
<div class="card" id="shot">
  <div class="stage">
    <div class="motif" style="--w:620px;--z:1.2;--r:12px">
      <div style="padding:22px 24px">
        <div class="status-grid">
          <div class="status-tile"><span class="sf-tab-lead" data-kind="thinking"><i class="codicon codicon-loading sf-icon-spin" style="font-size:15px"></i></span><span class="status-label">Denkt nach…</span></div>
          <div class="status-tile"><span class="sf-tab-lead" data-kind="streaming"><i class="codicon codicon-pulse" style="font-size:15px"></i></span><span class="status-label">Schreibt…</span></div>
          <div class="status-tile"><span class="sf-tab-lead" data-kind="tool"><i class="codicon codicon-tools" style="font-size:15px"></i></span><span class="status-label">Tool läuft</span></div>
          <div class="status-tile"><span class="sf-tab-lead" data-kind="waiting"><i class="codicon codicon-bell" style="font-size:15px"></i></span><span class="status-label">Wartet auf Antwort</span></div>
          <div class="status-tile"><span class="sf-tab-lead" data-kind="done"><i class="codicon codicon-check" style="font-size:15px"></i></span><span class="status-label">Fertig</span></div>
          <div class="status-tile"><span class="sf-tab-lead" data-kind="error"><i class="codicon codicon-error" style="font-size:15px"></i></span><span class="status-label">Fehler</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="note">Aktivitäts-Set — Denkt nach, Schreibt, Tool läuft, Wartet, Fertig, Fehler</div>
</div>
</body>
</html>
