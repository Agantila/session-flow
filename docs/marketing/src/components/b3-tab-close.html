<!doctype html>
<html lang="de" data-sf-ui-tabs="on active-sidebar close-always">
<head>
<meta charset="utf-8">
<title>Session Flow — b3-tab-close</title>
<link rel="stylesheet" href="assets/codicon.css">
<link rel="stylesheet" href="sf-plugin.css">
<link rel="stylesheet" href="showcase.css">
</head>
<body class="card-body">
<div class="card" id="shot">
  <div class="stage">
    <div class="motif" style="--w:440px;--z:1.7;--r:10px">
      <div class="uitab-row">
        <div class="uitab" data-sf-ui-tab="true" data-closeable>
          <span class="pane-tab-content"><span class="truncate">Chat</span></span>
          <span class="inset-y-0"><button type="button" title="Tab schließen"><i class="codicon codicon-close" style="font-size:12px"></i></button></span>
        </div>
        <div class="uitab" data-sf-ui-tab="true" data-closeable>
          <span class="pane-tab-content"><span class="truncate">Kanban</span></span>
          <span class="inset-y-0"><button type="button" title="Tab schließen" data-hov="1"><i class="codicon codicon-close" style="font-size:12px"></i></button></span>
        </div>
      </div>
    </div>
  </div>
  <div class="note">UI-Tabs — Close-Button normal und im Hover-Zustand</div>
</div>
</body>
</html>
