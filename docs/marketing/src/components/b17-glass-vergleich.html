<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Session Flow — b17-glass-vergleich</title>
<link rel="stylesheet" href="assets/codicon.css">
<link rel="stylesheet" href="sf-plugin.css">
<link rel="stylesheet" href="showcase.css">
</head>
<body class="card-body">
<div class="card" id="shot">
  <div class="stage">
    <div class="motif" style="--w:620px;--z:1.15;--r:12px">
      <div style="padding:22px 24px;background:var(--ui-chat-surface-background)">
        <div class="glass-compare">
          <div class="glass-cell">
            <span class="glass-caption">Glass aus</span>
            <div class="composer-surface" style="--sf-glass-grad:0%">
              <div class="sf-cproj-row"><button type="button" class="sf-cproj-pill"><span class="sf-cproj-dot" style="--sf-cproj-color:var(--ui-accent)"></span><span class="sf-cproj-name">session-flow</span><span class="sf-cproj-caret" aria-hidden="true">&#9662;</span></button></div>
              <button type="button" class="composer-add"><i class="codicon codicon-add" style="font-size:15px"></i></button>
              <input class="composer-input" placeholder="Was kommt als Nächstes?" readonly>
            </div>
          </div>
          <div class="glass-cell">
            <span class="glass-caption">Glass an</span>
            <div class="composer-surface" data-slot="composer-surface" style="--composer-fill:color-mix(in srgb, var(--ui-accent) 8%, color-mix(in srgb, var(--dt-card) 86%, transparent));--sf-glass-grad:12%;-webkit-backdrop-filter:blur(10px) saturate(115%);backdrop-filter:blur(10px) saturate(115%)">
              <div class="sf-cproj-row"><button type="button" class="sf-cproj-pill"><span class="sf-cproj-dot" style="--sf-cproj-color:var(--ui-accent)"></span><span class="sf-cproj-name">session-flow</span><span class="sf-cproj-caret" aria-hidden="true">&#9662;</span></button></div>
              <button type="button" class="composer-add"><i class="codicon codicon-add" style="font-size:15px"></i></button>
              <input class="composer-input" placeholder="Was kommt als Nächstes?" readonly>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="note">Glass — aus vs. an in der gleichen Szene</div>
</div>
</body>
</html>
