<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Session Flow — b1-navapps</title>
<link rel="stylesheet" href="assets/codicon.css">
<link rel="stylesheet" href="sf-plugin.css">
<link rel="stylesheet" href="showcase.css">
</head>
<body class="card-body">
<div class="card" id="shot">
  <div class="stage">
    <div class="motif" style="--w:470px;--z:1.6;--r:10px">
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:18px">
        <div>
          <div class="sf-subhead" style="margin:0 0 7px">Volle Breite</div>
          <div class="sf-navapps" style="width:430px" data-wide="1"><button type="button" class="sf-navapps-btn" data-nav="new-session" title="Neue Session"><i class="codicon codicon-robot" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="capabilities" title="Fähigkeiten"><i class="codicon codicon-symbol-misc" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="messaging" title="Messaging"><i class="codicon codicon-comment" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="artifacts" title="Artefakte"><i class="codicon codicon-files" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="cron" data-status="ok" title="Geplante Jobs · 2 aktiv"><i class="codicon codicon-watch" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="kanban" data-status="warn" title="Kanban · 3 offen"><i class="codicon codicon-project" style="font-size:15px"></i></button><span class="sf-navapps-rule"></span></div>
        </div>
        <div>
          <div class="sf-subhead" style="margin:0 0 7px">Schmale Breite — umfließend</div>
          <div class="sf-navapps" style="width:112px"><button type="button" class="sf-navapps-btn" data-nav="new-session" title="Neue Session"><i class="codicon codicon-robot" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="capabilities" title="Fähigkeiten"><i class="codicon codicon-symbol-misc" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="messaging" title="Messaging"><i class="codicon codicon-comment" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="artifacts" title="Artefakte"><i class="codicon codicon-files" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="cron" data-status="ok" title="Geplante Jobs · 2 aktiv"><i class="codicon codicon-watch" style="font-size:15px"></i></button><button type="button" class="sf-navapps-btn" data-nav="kanban" data-status="warn" title="Kanban · 3 offen"><i class="codicon codicon-project" style="font-size:15px"></i></button><span class="sf-navapps-rule"></span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="note">App-Schnellstart-Zeile — 6 Icon-Buttons mit Wrap-Verhalten</div>
</div>
</body>
</html>
