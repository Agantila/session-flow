<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Session Flow — b8-pinned-empty</title>
<link rel="stylesheet" href="assets/codicon.css">
<link rel="stylesheet" href="sf-plugin.css">
<link rel="stylesheet" href="showcase.css">
</head>
<body class="card-body">
<div class="card" id="shot">
  <div class="stage">
    <div class="motif" style="--w:600px;--z:1.3;--r:10px">
      <div class="sf-pane" style="padding:10px">
        <div class="sf-section" data-pinned-placeholder="true">
          <div class="sf-group-head sf-group-pinned">
            <span class="sf-group-lead-icon sf-group-lead-pin"><i class="codicon codicon-pin" style="font-size:13px"></i></span>
            <span class="sf-group-text"><span class="sf-group-name">Angepinnt</span></span>
            <span class="sf-group-actions" title="Alle lösen"><i class="codicon codicon-clear-all" style="font-size:14px"></i></span>
            <span class="sf-group-count">0</span>
          </div>
          <div class="sf-pin-placeholder"><i class="codicon codicon-pin" style="font-size:14px"></i>
            <span class="sf-pin-placeholder-text">Hier ablegen zum Anpinnen</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="note">Angepinnt — leerer Drop-Platzhalter</div>
</div>
</body>
</html>
