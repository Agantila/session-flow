<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Session Flow — b9-composer-chip</title>
<link rel="stylesheet" href="assets/codicon.css">
<link rel="stylesheet" href="sf-plugin.css">
<link rel="stylesheet" href="showcase.css">
</head>
<body class="card-body">
<div class="card" id="shot">
  <div class="stage">
    <div class="motif" style="--w:620px;--z:1.2;--r:12px">
      <div style="padding:20px 22px;background:var(--ui-chat-surface-background)">
        <div class="composer-surface">
          <div class="sf-cproj-row"><button type="button" class="sf-cproj-pill"><span class="sf-cproj-dot" style="--sf-cproj-color:var(--ui-accent)"></span><span class="sf-cproj-name">session-flow</span><span class="sf-cproj-caret" aria-hidden="true">&#9662;</span></button></div>
          <button type="button" class="composer-add" title="Anhang / Befehl"><i class="codicon codicon-add" style="font-size:15px"></i></button>
          <input class="composer-input" placeholder="Was kommt als Nächstes?" readonly>
        </div>
      </div>
    </div>
  </div>
  <div class="note">Projekt-Kontext-Chip — kalt in der Composer-Zeile</div>
</div>
</body>
</html>
