<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Session Flow — b11-suche-filter</title>
<link rel="stylesheet" href="assets/codicon.css">
<link rel="stylesheet" href="sf-plugin.css">
<link rel="stylesheet" href="showcase.css">
</head>
<body class="card-body">
<div class="card" id="shot">
  <div class="stage">
    <div class="motif" style="--w:600px;--z:1.35;--r:10px">
      <div style="padding:16px 18px;display:flex;flex-direction:column;gap:20px">
        <div>
          <div class="sf-subhead" style="margin:0 0 9px">Treffer · Suche aktiv</div>
          <div class="sf-filterbar"><div class="sf-filter-search"><i class="codicon codicon-search" style="font-size:12px"></i><input type="text" placeholder="Sessions durchsuchen…" value="composer" readonly><button type="button" class="sf-filter-clear" aria-label="Suche löschen"><i class="codicon codicon-close" style="font-size:11px"></i></button></div><div class="seg-track" role="radiogroup"><button type="button" data-active="true">Alle</button><button type="button" data-active="false">Aktiv</button><button type="button" data-active="false">Archiv</button></div></div>
        </div>
        <div>
          <div class="sf-subhead" style="margin:0 0 9px">Archiv-Filter · ohne Suchtext</div>
          <div class="sf-filterbar"><div class="sf-filter-search"><i class="codicon codicon-search" style="font-size:12px"></i><input type="text" placeholder="Sessions durchsuchen…" readonly></div><div class="seg-track" role="radiogroup"><button type="button" data-active="false">Alle</button><button type="button" data-active="false">Aktiv</button><button type="button" data-active="true">Archiv</button></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="note">Suche &amp; Schnellfilter — Suchfeld mit Löschen-X und Segment-Control</div>
</div>
</body>
</html>
