<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Session Flow — b2-pane-toolbar</title>
<link rel="stylesheet" href="assets/codicon.css">
<link rel="stylesheet" href="sf-plugin.css">
<link rel="stylesheet" href="showcase.css">
</head>
<body class="card-body">
<div class="card" id="shot">
  <div class="stage">
    <div class="motif" style="--w:600px;--z:1.25;--r:10px">
      <div style="padding:18px 20px;display:flex;flex-direction:column;gap:22px">
        <div>
          <div class="sf-subhead" style="margin:0 0 8px">Listen-Ansicht</div>
          <div class="sf-toolbar"><span class="sf-toolbar-count">60 Sessions</span><button type="button" class="iconbtn" title="Ansicht wechseln (Liste/Grid)"><i class="codicon codicon-layout" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Ansichtsoptionen"><i class="codicon codicon-list-filter" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Neues Projekt"><i class="codicon codicon-folder-library" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Neue Session"><i class="codicon codicon-add" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Neue Gruppe…"><i class="codicon codicon-layers" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Aktualisieren"><i class="codicon codicon-refresh" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Plugin-Einstellungen"><i class="codicon codicon-settings-gear" style="font-size:14px"></i></button></div>
        </div>
        <div>
          <div class="sf-subhead" style="margin:0 0 8px">Grid-Ansicht · Neue Session im Hover</div>
          <div class="sf-toolbar"><span class="sf-toolbar-count">60 Sessions</span><button type="button" class="iconbtn" title="Ansicht wechseln (Liste/Grid)"><i class="codicon codicon-list-unordered" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Ansichtsoptionen"><i class="codicon codicon-list-filter" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Neues Projekt"><i class="codicon codicon-folder-library" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Neue Session" data-nav="add"><i class="codicon codicon-add" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Neue Gruppe…"><i class="codicon codicon-layers" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Aktualisieren"><i class="codicon codicon-refresh" style="font-size:14px"></i></button><button type="button" class="iconbtn" title="Plugin-Einstellungen"><i class="codicon codicon-settings-gear" style="font-size:14px"></i></button></div>
        </div>
      </div>
    </div>
  </div>
  <div class="note">Pane-Toolbar — Ansicht, Filter-Optionen, Projekt, Session, Gruppe, Refresh, Einstellungen</div>
</div>
</body>
</html>
